#test commit local
services:
  film_room_dev:
    build: .
    container_name: sports_film_room_dev
    ports:
      - "8125:8123"
    volumes:
      - ./data:/app/data
    # Hardware acceleration support (Intel VA-API / QuickSync)
    devices:
      - /dev/dri:/dev/dri
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    restart: unless-stopped
