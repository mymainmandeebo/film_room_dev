<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Film Room — Sign In</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23ea580c' stroke='%230f172a' stroke-width='6'/%3E%3Cpath d='M50 4 v92 M4 50 h92' stroke='%230f172a' stroke-width='5' fill='none'/%3E%3Cpath d='M17 17 C35 32 35 68 17 83' stroke='%230f172a' stroke-width='5' fill='none'/%3E%3Cpath d='M83 17 C65 32 65 68 83 83' stroke='%230f172a' stroke-width='5' fill='none'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Roboto', 'system-ui', 'sans-serif'] },
          colors: {
            md: {
              primary: '#6750A4', 'on-primary': '#FFFFFF',
              'primary-container': '#EADDFF', 'on-primary-container': '#21005D',
              error: '#B3261E', 'on-error': '#FFFFFF',
              surface: '#FEF7FF', 'on-surface': '#1D1B20',
              'surface-variant': '#E7E0EC', 'on-surface-variant': '#49454F',
              'outline-variant': '#CAC4D0',
              'surface-container-lowest': '#FFFFFF',
              'surface-container-high': '#ECE6F0',
              'dark-primary': '#D0BCFF', 'dark-on-primary': '#381E72',
              'dark-error': '#F2B8B5',
              'dark-surface': '#141218', 'dark-on-surface': '#E6E0E9',
              'dark-on-surface-variant': '#CAC4D0',
              'dark-outline-variant': '#49454F',
              'dark-surface-container-lowest': '#0F0D13',
              'dark-surface-container-low': '#1D1B20',
              'dark-surface-container-high': '#2B2930',
            }
          },
          borderRadius: { 'md-xl': '28px', 'md-sm': '8px' },
          boxShadow: { 'md-3': '0 1px 3px 0 rgba(0,0,0,0.3), 0 4px 8px 3px rgba(0,0,0,0.15)' }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      font-size: 24px; line-height: 1; display: inline-flex;
      align-items: center; justify-content: center; user-select: none;
    }
    .material-symbols-outlined.filled { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  </style>
</head>
<body class="bg-md-surface dark:bg-md-dark-surface text-md-on-surface dark:text-md-dark-on-surface min-h-screen flex items-center justify-center font-sans p-4">

  <div class="bg-md-surface-container-lowest dark:bg-md-dark-surface-container-low border border-md-outline-variant dark:border-md-dark-outline-variant rounded-md-xl shadow-md-3 w-full max-w-md flex flex-col gap-5 p-6">

    <div class="text-center flex flex-col items-center gap-2">
      <div class="w-16 h-16 rounded-full bg-md-primary-container dark:bg-md-dark-primary flex items-center justify-center">
        <span class="material-symbols-outlined filled text-md-on-primary-container dark:text-md-dark-on-primary" style="font-size: 32px;">sports</span>
      </div>
      <h1 class="text-2xl font-medium mt-2">Film Room</h1>
      <p class="text-sm text-md-on-surface-variant dark:text-md-dark-on-surface-variant">Sign in to access your game tapes</p>
    </div>

    <form id="loginForm" class="flex flex-col gap-4" onsubmit="event.preventDefault(); handleLogin()">
      <div>
        <label class="text-xs font-semibold text-md-on-surface-variant dark:text-md-dark-on-surface-variant block mb-1">Username</label>
        <input type="text" id="loginUser" autocorrect="off" autocapitalize="none"
          class="w-full bg-md-surface-container-high dark:bg-md-dark-surface-container-high border border-md-outline-variant dark:border-md-dark-outline-variant rounded-md-sm px-4 py-3 text-sm focus:outline-none focus:border-md-primary dark:focus:border-md-dark-primary" />
      </div>
      <div>
        <label class="text-xs font-semibold text-md-on-surface-variant dark:text-md-dark-on-surface-variant block mb-1">Password</label>
        <input type="password" id="loginPass"
          class="w-full bg-md-surface-container-high dark:bg-md-dark-surface-container-high border border-md-outline-variant dark:border-md-dark-outline-variant rounded-md-sm px-4 py-3 text-sm focus:outline-none focus:border-md-primary dark:focus:border-md-dark-primary" />
      </div>

      <p id="loginErr" class="text-sm text-md-error dark:text-md-dark-error font-medium text-center hidden">Invalid username or password.</p>

      <button type="submit" id="loginBtn"
        class="mt-1 inline-flex items-center justify-center gap-2 rounded-full bg-md-primary dark:bg-md-dark-primary text-md-on-primary dark:text-md-dark-on-primary font-medium text-sm px-6 py-3 hover:shadow-md transition-shadow">
        <span class="material-symbols-outlined" style="font-size: 18px;">login</span>
        Sign In
      </button>
    </form>

  </div>

  <script>
    // Redirect immediately if already authenticated
    (function () {
      const token = localStorage.getItem('token');
      if (token) {
        try {
          const payload = JSON.parse(atob(token.split('.')[1]));
          if (payload.exp && payload.exp * 1000 > Date.now()) {
            window.location.replace('/app');
          } else {
            localStorage.removeItem('token');
          }
        } catch {
          localStorage.removeItem('token');
        }
      }
    })();

    // Apply saved theme before paint to avoid flash
    if (localStorage.getItem('analyzerTheme') !== 'light') {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }

    async function handleLogin() {
      const btn = document.getElementById('loginBtn');
      const errEl = document.getElementById('loginErr');
      const u = document.getElementById('loginUser').value.trim();
      const p = document.getElementById('loginPass').value;

      errEl.classList.add('hidden');

      if (!u || !p) {
        errEl.textContent = 'Please enter your username and password.';
        errEl.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `<span class="material-symbols-outlined animate-spin" style="font-size: 18px;">progress_activity</span> Signing in…`;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });

        if (res.ok) {
          const data = await res.json();
          localStorage.setItem('token', data.access_token);
          window.location.replace('/app');
        } else {
          errEl.textContent = 'Invalid username or password.';
          errEl.classList.remove('hidden');
          btn.disabled = false;
          btn.innerHTML = `<span class="material-symbols-outlined" style="font-size: 18px;">login</span> Sign In`;
        }
      } catch {
        errEl.textContent = 'Network error — please try again.';
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = `<span class="material-symbols-outlined" style="font-size: 18px;">login</span> Sign In`;
      }
    }
  </script>
</body>
</html>
